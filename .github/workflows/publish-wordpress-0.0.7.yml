name: Publier la 0.0.7 sur WordPress.org

on:
  push:
    branches: [release/wordpress-org-0.0.7]
    paths: ['.github/workflows/publish-wordpress-0.0.7.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: wordpress-org-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le commit fusionné
        uses: actions/checkout@v7
        with:
          ref: 039496cc91ee8f7ae7b6a389f704c91b50b66914
          fetch-depth: 0
          persist-credentials: false

      - name: Vérifier le commit et les contrôles de cette version
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SVN_PASSWORD"
          tested=98186d6e65241318d3ac72de5dcce5c0bedf1aa1
          release=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$tested" "$release"
          git diff --exit-code "$tested" "$release"
          git merge-base --is-ancestor "$release" origin/master
          sha="$tested"
          for run_id in 44738681370 44738681374; do
            result=$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '[.head_sha, .event, .conclusion] | join(" ")')
            test "$result" = "$sha pull_request success"
          done
          grep -Fx ' * Version: 0.0.7' dendrila-privacy.php
          grep -Fx 'Stable tag: 0.0.7' readme.txt

      - name: Créer le tag Git v0.0.7 sur le commit fusionné
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          current=$(git ls-remote origin refs/tags/v0.0.7 | cut -f1)
          if [ -z "$current" ]; then
            gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/v0.0.7 -f sha="$sha" --jq .ref
          else
            test "$current" = "$sha"
          fi

      - name: Publier dans le répertoire WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2
        env:
          SVN_USERNAME: juliane16
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: dendrila-privacy
          # The separate icon workflow keeps the WordPress.org PNG and SVG assets in sync.
          ASSETS_DIR: .wordpress-org-svn-assets-disabled
          VERSION: 0.0.7
