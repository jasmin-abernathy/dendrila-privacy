name: Dendrila Privacy quality and distribution

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - 'dendrila-privacy.php'
      - 'includes/**'
      - 'assets/**'
      - 'languages/**'
      - 'readme.txt'
      - 'tests/**'
      - '.distignore'
      - '.github/workflows/quality-and-build.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'dendrila-privacy.php'
      - 'includes/**'
      - 'assets/**'
      - 'languages/**'
      - 'readme.txt'
      - 'tests/**'
      - '.distignore'
      - '.github/workflows/quality-and-build.yml'
  workflow_dispatch:

concurrency:
  group: dendrila-privacy-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quick-check:
    name: Quick branch check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Metadata consistency
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_VERSION=$(sed -n 's/^[[:space:]]*\* Version:[[:space:]]*//p' dendrila-privacy.php | head -n1 | tr -d '\r')
          CONST_VERSION=$(sed -n "s/.*const VERSION = '\([^']*\)'.*/\1/p" dendrila-privacy.php | head -n1 | tr -d '\r')
          STABLE_TAG=$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | head -n1 | tr -d '\r')
          test -n "$PLUGIN_VERSION"
          test "$PLUGIN_VERSION" = "$CONST_VERSION"
          test "$PLUGIN_VERSION" = "$STABLE_TAG"
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './build/*' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        shell: bash
        run: find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  metadata:
    name: Validate WordPress metadata
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check version, readme and tags
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_VERSION=$(sed -n 's/^[[:space:]]*\* Version:[[:space:]]*//p' dendrila-privacy.php | head -n1 | tr -d '\r')
          CONST_VERSION=$(sed -n "s/.*const VERSION = '\([^']*\)'.*/\1/p" dendrila-privacy.php | head -n1 | tr -d '\r')
          STABLE_TAG=$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | head -n1 | tr -d '\r')
          TAG_COUNT=$(grep '^Tags:' readme.txt | cut -d: -f2- | tr ',' '\n' | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')
          README_BYTES=$(wc -c < readme.txt | tr -d ' ')

          echo "Plugin header version: ${PLUGIN_VERSION}"
          echo "Runtime constant version: ${CONST_VERSION}"
          echo "Stable tag: ${STABLE_TAG}"
          echo "WordPress.org tags: ${TAG_COUNT}"
          echo "readme.txt size: ${README_BYTES} bytes"

          test -n "${PLUGIN_VERSION}"
          test "${PLUGIN_VERSION}" = "${CONST_VERSION}"
          test "${PLUGIN_VERSION}" = "${STABLE_TAG}"

          if [ "${TAG_COUNT}" -gt 5 ]; then
            echo "readme.txt contains more than five WordPress.org tags."
            exit 1
          fi

          if [ "${README_BYTES}" -gt 10240 ]; then
            echo "readme.txt is larger than 10 KiB. Keep the directory readme concise."
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
            if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
              echo "Formal release tags must be numeric, for example v0.1.0."
              exit 1
            fi
            test "${RELEASE_VERSION}" = "${PLUGIN_VERSION}"
          fi

  php-lint:
    name: PHP ${{ matrix.php }} syntax
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.4'
          - '8.3'
          - '8.4'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP files
        shell: bash
        run: find . -type f -name '*.php' -not -path './build/*' -print0 | xargs -0 -n1 php -l
      - name: Consent core tests
        run: php tests/consent-core.php

  javascript-syntax:
    name: JavaScript syntax
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check JavaScript files
        shell: bash
        run: find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  plugin-check:
    name: Official WordPress Plugin Check
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1.1.9
        with:
          wp-version: latest
          slug: dendrila-privacy
          exclude-directories: '.github,docs,build,dist'
          exclude-files: '.gitattributes,.editorconfig,.gitignore,.distignore,README.md,README.fr.md,CODE_OF_CONDUCT.md,CODE_OF_CONDUCT.fr.md,CONTRIBUTING.md,CONTRIBUTING.fr.md,SECURITY.md,SECURITY.fr.md,AGENTS.md,COPYRIGHT.md,TRADEMARKS.md'

  package:
    name: Build installable ZIP
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs:
      - metadata
      - php-lint
      - javascript-syntax
      - plugin-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build ZIP from .distignore
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^[[:space:]]*\* Version:[[:space:]]*//p' dendrila-privacy.php | head -n1 | tr -d '\r')
          ZIP="build/dendrila-privacy-${VERSION}.zip"
          STAGE="${RUNNER_TEMP}/dendrila-privacy-dist"
          ROOT="${STAGE}/dendrila-privacy"

          rm -rf "$STAGE"
          mkdir -p "$ROOT" build

          # Keep release creation independent from third-party WP-CLI package downloads.
          # .distignore contains the single source of truth for development-only exclusions.
          rsync -a --exclude-from=.distignore ./ "$ROOT/"

          (
            cd "$STAGE"
            zip -qr "${GITHUB_WORKSPACE}/$ZIP" dendrila-privacy
          )

          unzip -t "$ZIP"
          unzip -Z1 "$ZIP" | grep -qx 'dendrila-privacy/dendrila-privacy.php'
          unzip -Z1 "$ZIP" | grep -qx 'dendrila-privacy/readme.txt'
          unzip -Z1 "$ZIP" | grep -qx 'dendrila-privacy/LICENSE'

          for forbidden in '.github/' 'docs/' 'README.md' 'README.fr.md' '.distignore' '.gitignore' '.gitattributes' '.editorconfig' 'CODE_OF_CONDUCT.md' 'CONTRIBUTING.md' 'SECURITY.md' 'AGENTS.md' 'COPYRIGHT.md' 'TRADEMARKS.md'; do
            if unzip -Z1 "$ZIP" | grep -q "^dendrila-privacy/${forbidden}"; then
              echo "Development-only path leaked into distribution: ${forbidden}"
              exit 1
            fi
          done

          DIGEST=$(sha256sum "$ZIP" | awk '{print $1}')
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: dendrila-privacy-${{ steps.package.outputs.version }}.zip
          path: ${{ steps.package.outputs.zip }}
          archive: false
          retention-days: 7
